services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: isaiascuvula
      POSTGRES_PASSWORD: isaiascuvula
      POSTGRES_DB: taskflow
    ports:
      - "9999:9898"

  quarkus:
    image: isaiah/task-flow:1.0.0
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/taskflow
      QUARKUS_DATASOURCE_USERNAME: isaiascuvula
      QUARKUS_DATASOURCE_PASSWORD: isaiascuvula
    depends_on:
      - postgres
